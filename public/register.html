<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultChain — Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e6edf3;
            padding: 2rem 1rem;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            color: #3b82f6;
        }

        .brand-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: -0.02em;
        }

        .brand-tagline {
            font-size: 0.875rem;
            color: #8b949e;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 1.75rem;
        }

        .separator {
            height: 1px;
            background: #21262d;
            margin-bottom: 1.5rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .field input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 7px;
            color: #e6edf3;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input::placeholder { color: #484f58; }
        .field input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-register {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-top: 0.5rem;
            background: #3b82f6;
            border: none;
            border-radius: 7px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-register:hover { background: #2563eb; }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }

        #message {
            margin-top: 0.875rem;
            padding: 0.625rem 0.875rem;
            border-radius: 7px;
            font-size: 0.825rem;
            opacity: 0;
            transform: translateY(-6px);
            transition: all 0.25s ease;
            pointer-events: none;
        }
        #message.error  { opacity: 1; transform: translateY(0); pointer-events: all; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #f87171; }
        #message.success { opacity: 1; transform: translateY(0); pointer-events: all; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.25); color: #4ade80; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0 0;
            color: #484f58;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #21262d;
        }

        .footer-link {
            margin-top: 1.25rem;
            text-align: center;
            font-size: 0.875rem;
            color: #8b949e;
        }
        .footer-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover { text-decoration: underline; }

        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="brand-name">VaultChain</h1>
        <p class="brand-tagline">Crea tu identidad cifrada</p>
    </div>

    <div class="card">
        <div class="separator"></div>

        <form id="registerForm">
            <div class="field">
                <label for="display_name">Nombre para mostrar</label>
                <input type="text" id="display_name" placeholder="Tu nombre" required autocomplete="name">
            </div>
            <div class="field">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="nombre@empresa.com" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
            </div>
            <div class="field">
                <label for="password_confirmation">Confirmar contraseña</label>
                <input type="password" id="password_confirmation" placeholder="Repite tu contraseña" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-register" id="submitBtn">
                Crear cuenta &rarr;
            </button>
        </form>

        <div id="message"></div>

        <div class="divider">¿Ya tienes cuenta?</div>
    </div>

    <div class="footer-link">
        ¿Ya eres miembro? <a href="/login.html">Inicia sesión aquí</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const display_name = document.getElementById('display_name').value.trim();
            const password = document.getElementById('password').value;
            const password_confirmation = document.getElementById('password_confirmation').value;
            const msgEl = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Generando llaves...';
            msgEl.className = '';
            msgEl.textContent = '';

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        display_name,
                        password,
                        password_confirmation
                    })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (e) {
                    console.error("Error parsing JSON:", e);
                }

                if (response.ok) {
                    msgEl.textContent = 'Registro exitoso. Redirigiendo...';
                    msgEl.className = 'success';
                    setTimeout(() => window.location.href = '/login.html', 1500);
                } else {
                    const errorMsg = data.errors ? data.errors.join(', ') : (data.error || 'Error en el registro');
                    msgEl.textContent = errorMsg;
                    msgEl.className = 'error';
                    btn.disabled = false;
                    btn.innerHTML = 'Crear cuenta &rarr;';
                }
            } catch (err) {
                console.error("Fetch error:", err);
                msgEl.textContent = 'Error de conexión. Intenta más tarde.';
                msgEl.className = 'error';
                btn.disabled = false;
                btn.innerHTML = 'Crear cuenta &rarr;';
            }
        });
    </script>
</body>
</html>
