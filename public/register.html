<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultChain - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .container:hover { transform: translateY(-5px); }
        h1 { text-align: center; margin-bottom: 2rem; font-weight: 600; font-size: 1.8rem; background: linear-gradient(to right, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #cbd5e1; }
        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: #a855f7; box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2); }
        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: linear-gradient(to right, #9333ea, #db2777);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        .link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .link a { color: #a855f7; text-decoration: none; transition: color 0.3s; }
        .link a:hover { color: #ec4899; }
        #message { margin-top: 1rem; text-align: center; font-size: 0.9rem; min-height: 1.2rem; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crear Cuenta</h1>
        <form id="registerForm">
            <div class="input-group">
                <label for="display_name">Nombre para mostrar</label>
                <input type="text" id="display_name" required placeholder="Tu nombre">
            </div>
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="password_confirmation">Confirmar Contraseña</label>
                <input type="password" id="password_confirmation" required placeholder="••••••••">
            </div>
            <button type="submit">Registrarse</button>
        </form>
        <div id="message"></div>
        <div class="link">
            ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const display_name = document.getElementById('display_name').value;
            const password = document.getElementById('password').value;
            const password_confirmation = document.getElementById('password_confirmation').value;
            const msgEl = document.getElementById('message');
            const btn = e.target.querySelector('button');
            
            // UI loading state
            btn.disabled = true;
            const originalBtnText = btn.textContent;
            btn.textContent = 'Procesando...';
            msgEl.textContent = '';
            msgEl.className = '';

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, display_name, password, password_confirmation })
                });
                
                let data = {};
                try {
                    data = await response.json();
                } catch (e) {
                    console.error("Error parsing JSON:", e);
                }
                
                if (response.ok) {
                    msgEl.textContent = '✔ ¡Registro exitoso! Redirigiendo...';
                    msgEl.className = 'success';
                    setTimeout(() => window.location.href = '/login.html', 1500);
                } else {
                    const errorMsg = data.errors ? data.errors.join(', ') : (data.error || 'Error en el registro');
                    msgEl.textContent = errorMsg;
                    msgEl.className = 'error';
                    btn.disabled = false;
                    btn.textContent = originalBtnText;
                }
            } catch (err) {
                console.error("Fetch error:", err);
                msgEl.textContent = 'Error de conexión. Intenta más tarde.';
                msgEl.className = 'error';
                btn.disabled = false;
                btn.textContent = originalBtnText;
            }
        });
    </script>
</body>
</html>
