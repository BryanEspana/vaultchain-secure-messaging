<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultChain — Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e6edf3;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            color: #3b82f6;
        }

        .brand-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: -0.02em;
        }

        .brand-tagline {
            font-size: 0.875rem;
            color: #8b949e;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 1.75rem;
        }

        .separator {
            height: 1px;
            background: #21262d;
            margin-bottom: 1.5rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .field-row label { margin-bottom: 0; }

        .forgot-link {
            font-size: 0.72rem;
            font-weight: 600;
            color: #3b82f6;
            text-decoration: none;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .forgot-link:hover { text-decoration: underline; }

        .field input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 7px;
            color: #e6edf3;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input::placeholder { color: #484f58; }
        .field input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-signin {
            width: 100%;
            padding: 0.7rem 1rem;
            margin-top: 0.5rem;
            background: #3b82f6;
            border: none;
            border-radius: 7px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-signin:hover { background: #2563eb; }
        .btn-signin:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
            color: #484f58;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #21262d;
        }

        #message {
            margin-top: 0.875rem;
            padding: 0.625rem 0.875rem;
            border-radius: 7px;
            font-size: 0.825rem;
            opacity: 0;
            transform: translateY(-6px);
            transition: all 0.25s ease;
            pointer-events: none;
        }
        #message.error  { opacity: 1; transform: translateY(0); pointer-events: all; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #f87171; }
        #message.success { opacity: 1; transform: translateY(0); pointer-events: all; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.25); color: #4ade80; }

        .footer-link {
            margin-top: 1.25rem;
            text-align: center;
            font-size: 0.875rem;
            color: #8b949e;
        }
        .footer-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover { text-decoration: underline; }

        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="brand-name">VaultChain</h1>
        <p class="brand-tagline">Mensajería cifrada de extremo a extremo</p>
    </div>

    <div class="card">
        <div class="separator"></div>

        <form id="loginForm">
            <div id="step1">
                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="nombre@empresa.com" required autocomplete="email">
                </div>

                <div class="field">
                    <div class="field-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿Olvidaste?</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div id="step2" style="display: none;">
                <div class="field">
                    <label for="mfaCode">Código de Autenticación (MFA)</label>
                    <input type="text" id="mfaCode" placeholder="123456" autocomplete="one-time-code" maxlength="6">
                </div>
            </div>

            <button type="submit" class="btn-signin" id="submitBtn">
                Ingresar &rarr;
            </button>
        </form>

        <div id="message"></div>

        <div class="divider">O continúa con</div>

        <div class="footer-link" style="margin-top:0;">
            <a href="/register.html">Crear una cuenta nueva</a>
        </div>
    </div>

    <div class="footer-link">
        ¿Nuevo en VaultChain? <a href="/register.html">Crear una cuenta</a>
    </div>

    <script>
        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function concatUint8Arrays(...arrays) {
            const totalLength = arrays.reduce((total, array) => total + array.byteLength, 0);
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            arrays.forEach((array) => {
                combined.set(array, offset);
                offset += array.byteLength;
            });
            return combined;
        }

        async function decryptStoredPrivateKey(encryptedPrivateKey, password) {
            const combined = new Uint8Array(base64ToArrayBuffer(encryptedPrivateKey));
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const authTag = combined.slice(28, 44);
            const encryptedPem = combined.slice(44);

            const passwordKey = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );

            const aesKey = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                passwordKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );

            const encryptedPemWithTag = concatUint8Arrays(encryptedPem, authTag);
            const privateKeyBuffer = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv, tagLength: 128 },
                aesKey,
                encryptedPemWithTag
            );

            return new TextDecoder().decode(privateKeyBuffer);
        }

        let tempToken = null;
        let pendingPassword = null;

        async function finalizeLogin(data, password, msgEl, btn) {
            msgEl.textContent = 'Descifrando bóveda personal...';
            msgEl.className = 'success';

            try {
                if (data.encrypted_private_key) {
                    const decryptedKey = await decryptStoredPrivateKey(data.encrypted_private_key, password);
                    sessionStorage.setItem('vc_private_key', decryptedKey);
                }

                localStorage.setItem('vc_token', data.token);
                localStorage.setItem('vc_user_id', data.user_id);
                if (data.public_key) {
                    localStorage.setItem('vc_public_key', data.public_key);
                }

                msgEl.textContent = 'Acceso concedido. Redirigiendo...';
                setTimeout(() => { window.location.href = '/chat.html'; }, 800);
            } catch (cryptoErr) {
                console.error("Decryption error:", cryptoErr);
                msgEl.textContent = 'Error al descifrar llaves. ¿Es la contraseña correcta?';
                msgEl.className = 'error';
                btn.disabled = false;
                btn.innerHTML = 'Ingresar &rarr;';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const code     = document.getElementById('mfaCode').value.trim();
            const msgEl    = document.getElementById('message');
            const btn      = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Autenticando...';
            msgEl.className = '';
            msgEl.textContent = '';

            if (tempToken) {
                // Step 2: MFA Verify
                try {
                    const response = await fetch('/auth/mfa/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ temp_token: tempToken, code: code })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        await finalizeLogin(data, pendingPassword, msgEl, btn);
                    } else {
                        const errorMsg = data.error || 'Código MFA inválido.';
                        msgEl.textContent = errorMsg;
                        msgEl.className = 'error';
                        btn.disabled = false;
                        btn.innerHTML = 'Verificar Código &rarr;';
                        document.getElementById('mfaCode').value = '';
                    }
                } catch (err) {
                    console.error("Fetch error:", err);
                    msgEl.textContent = 'Error de conexión. Revisa que el servidor esté activo.';
                    msgEl.className = 'error';
                    btn.disabled = false;
                    btn.innerHTML = 'Verificar Código &rarr;';
                }
                return;
            }

            // Step 1: Login
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (e) {
                    console.error("Error parsing JSON:", e);
                }

                if (response.ok) {
                    if (data.mfa_required) {
                        tempToken = data.temp_token;
                        pendingPassword = password;
                        document.getElementById('step1').style.display = 'none';
                        document.getElementById('step2').style.display = 'block';
                        document.getElementById('mfaCode').focus();
                        document.getElementById('email').removeAttribute('required');
                        document.getElementById('password').removeAttribute('required');
                        document.getElementById('mfaCode').setAttribute('required', 'true');
                        msgEl.textContent = 'Ingresa el código MFA de tu aplicación (Google Authenticator)';
                        msgEl.className = 'success';
                        btn.disabled = false;
                        btn.innerHTML = 'Verificar Código &rarr;';
                    } else {
                        await finalizeLogin(data, password, msgEl, btn);
                    }
                } else {
                    const errorMsg = data.error || 'Credenciales inválidas. Por favor intenta de nuevo.';
                    msgEl.textContent = errorMsg;
                    msgEl.className = 'error';
                    btn.disabled = false;
                    btn.innerHTML = 'Ingresar &rarr;';
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                console.error("Fetch error:", err);
                msgEl.textContent = 'Error de conexión. Revisa que el servidor esté activo.';
                msgEl.className = 'error';
                btn.disabled = false;
                btn.innerHTML = 'Ingresar &rarr;';
            }
        });
    </script>
</body>
</html>
