<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultChain - Chat Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            display: flex;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        /* Sidebar (Contacts) */
        .sidebar {
            width: 300px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .contacts-list {
            flex-grow: 1;
            overflow-y: auto;
        }
        .contact {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .contact:hover, .contact.active {
            background: rgba(255, 255, 255, 0.1);
        }
        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        /* Chat Area */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.1);
        }
        .messages-container {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 70%;
            padding: 1rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }
        .message.received {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .message.sent {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .message-meta {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.5rem;
            text-align: right;
            display: block;
        }
        .lock-icon {
            font-size: 0.8rem;
            margin-right: 5px;
            opacity: 0.8;
        }
        .message.encrypted {
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        
        /* Input Area */
        .input-area {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.2);
        }
        .input-area input {
            flex-grow: 1;
            padding: 1rem;
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-area input:focus {
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.1);
        }
        .input-area button {
            padding: 0 1.5rem;
            border-radius: 0.75rem;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.3);
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }

        /* Sidebar sections */
        .sidebar-section-label {
            padding: 0.5rem 1.5rem 0.25rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #475569;
        }
        .new-group-btn {
            margin: 0.75rem 1.25rem;
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.2));
            border: 1px solid rgba(139,92,246,0.35);
            color: #a78bfa;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            width: calc(100% - 2.5rem);
        }
        .new-group-btn:hover {
            background: linear-gradient(135deg, rgba(139,92,246,0.35), rgba(59,130,246,0.35));
            border-color: rgba(139,92,246,0.6);
            transform: translateY(-1px);
        }
        .group-avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1rem;
        }
        .contact-badge {
            margin-left: auto;
            background: rgba(139,92,246,0.25);
            border: 1px solid rgba(139,92,246,0.4);
            color: #a78bfa;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 999px;
        }

        /* Group modal */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            padding: 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.25rem; background: linear-gradient(to right, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal input[type="text"] {
            width: 100%; padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; outline: none;
            margin-bottom: 1rem;
            font-family: 'Inter', sans-serif;
        }
        .modal input[type="text"]:focus { border-color: #8b5cf6; }
        .user-checkboxes { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; max-height: 180px; overflow-y: auto; }
        .user-check-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 0.75rem;
            border-radius: 0.6rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            cursor: pointer;
            transition: background 0.15s;
        }
        .user-check-item:hover { background: rgba(139,92,246,0.15); }
        .user-check-item input { accent-color: #8b5cf6; width: 16px; height: 16px; }
        .user-check-item label { color: #cbd5e1; font-size: 0.9rem; cursor: pointer; }
        .modal-actions { display: flex; gap: 0.75rem; }
        .modal-btn {
            flex: 1; padding: 0.75rem;
            border-radius: 0.75rem;
            border: none; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all 0.2s;
        }
        .modal-btn.primary { background: linear-gradient(135deg, #7c3aed, #2563eb); color: white; }
        .modal-btn.primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .modal-btn.secondary { background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }

        /* Group header members pills */
        .member-pills { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.3rem; }
        .member-pill {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 999px;
            background: rgba(139,92,246,0.2); border: 1px solid rgba(139,92,246,0.35);
            color: #c4b5fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>VaultChain</h2>
            </div>
            <div class="contacts-list" id="contactsList">
                <div class="sidebar-section-label">Contactos</div>
                <div id="directContactsList"></div>
                <div class="sidebar-section-label" style="margin-top:0.5rem;">Grupos</div>
                <button class="new-group-btn" id="newGroupBtn">
                    <span>＋</span> Nuevo Grupo
                </button>
                <div id="groupsList"></div>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="contact-avatar" id="chatAvatar">?</div>
                <div>
                    <h3 style="font-size: 1.1rem;" id="chatName">Selecciona un contacto</h3>
                    <span style="font-size: 0.8rem; opacity: 0.7; color: #10b981;" id="chatStatus">Conexión Segura E2EE</span>
                    <div class="member-pills" id="memberPills"></div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>
            
            <form class="input-area" id="messageForm">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje cifrado..." required autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Modal para crear grupo -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal">
            <h3>🔐 Crear Grupo Cifrado</h3>
            <input type="text" id="groupNameInput" placeholder="Nombre del grupo">
            <div class="user-checkboxes" id="userCheckboxes"></div>
            <div class="modal-actions">
                <button class="modal-btn secondary" id="cancelGroupBtn">Cancelar</button>
                <button class="modal-btn primary" id="createGroupBtn">Crear Grupo</button>
            </div>
        </div>
    </div>

    <script>
        // Wrapper global para fetch que añade headers necesarios para ngrok
        async function apiFetch(url, options = {}) {
            const headers = {
                'ngrok-skip-browser-warning': '1',
                ...(options.headers || {})
            };
            return fetch(url, { ...options, headers });
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';

            for (let i = 0; i < bytes.byteLength; i += 1) {
                binary += String.fromCharCode(bytes[i]);
            }

            return btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }

            return bytes.buffer;
        }

        function concatUint8Arrays(...arrays) {
            const totalLength = arrays.reduce((total, array) => total + array.byteLength, 0);
            const combined = new Uint8Array(totalLength);
            let offset = 0;

            arrays.forEach((array) => {
                combined.set(array, offset);
                offset += array.byteLength;
            });

            return combined;
        }

        function pemToArrayBuffer(pem) {
            const base64 = pem
                .replace(/-----BEGIN PUBLIC KEY-----/g, '')
                .replace(/-----END PUBLIC KEY-----/g, '')
                .replace(/\s+/g, '');

            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }

            return bytes.buffer;
        }

        function getRecipientId() {
            return localStorage.getItem('vc_recipient_id') || document.querySelector('.contact.active')?.dataset.recipientId || '';
        }

        async function fetchRecipientPublicKey(recipientId) {
            const response = await apiFetch(`/users/${recipientId}/key`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'No se pudo obtener la llave pública del destinatario');
            }

            return data.public_key;
        }

        async function encryptMessageForRecipients(plaintext, recipients) {
            const textEncoder = new TextEncoder();
            const aesKey = await crypto.subtle.generateKey(
                { name: 'AES-GCM', length: 256 },
                true,
                ['encrypt']
            );
            const nonce = crypto.getRandomValues(new Uint8Array(12));
            const ciphertextBuffer = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: nonce },
                aesKey,
                textEncoder.encode(plaintext)
            );
            const rawAesKey = await crypto.subtle.exportKey('raw', aesKey);

            // Encrypt the AES key for each recipient
            const encryptedKeys = {};
            for (const [userId, publicKeyPem] of Object.entries(recipients)) {
                const recipientKey = await crypto.subtle.importKey(
                    'spki',
                    pemToArrayBuffer(publicKeyPem),
                    { name: 'RSA-OAEP', hash: 'SHA-256' },
                    false,
                    ['encrypt']
                );
                const encryptedKeyBuffer = await crypto.subtle.encrypt(
                    { name: 'RSA-OAEP' },
                    recipientKey,
                    rawAesKey
                );
                encryptedKeys[userId] = arrayBufferToBase64(encryptedKeyBuffer);
            }

            const encryptedBytes = new Uint8Array(ciphertextBuffer);
            const authTag = encryptedBytes.slice(encryptedBytes.length - 16);
            const ciphertext = encryptedBytes.slice(0, encryptedBytes.length - 16);

            return {
                ciphertext: arrayBufferToBase64(ciphertext),
                encrypted_key: JSON.stringify(encryptedKeys), // Store as JSON string
                nonce: arrayBufferToBase64(nonce),
                auth_tag: arrayBufferToBase64(authTag)
            };
        }

        function privateKeyPemToArrayBuffer(pem) {
            const base64 = pem
                .replace(/-----BEGIN [A-Z ]+-----/g, '')
                .replace(/-----END [A-Z ]+-----/g, '')
                .replace(/\s+/g, '');

            return base64ToArrayBuffer(base64);
        }

        function encodeDerLength(length) {
            if (length < 128) return new Uint8Array([length]);

            const bytes = [];
            let value = length;

            while (value > 0) {
                bytes.unshift(value & 0xff);
                value >>= 8;
            }

            return new Uint8Array([0x80 | bytes.length, ...bytes]);
        }

        function encodeDerElement(tag, body) {
            return concatUint8Arrays(new Uint8Array([tag]), encodeDerLength(body.byteLength), body);
        }

        function pkcs1PrivateKeyToPkcs8(pkcs1Der) {
            const version = new Uint8Array([0x02, 0x01, 0x00]);
            const rsaEncryptionAlgorithm = new Uint8Array([
                0x30, 0x0d,
                0x06, 0x09,
                0x2a, 0x86, 0x48, 0x86, 0xf7, 0x0d, 0x01, 0x01, 0x01,
                0x05, 0x00
            ]);
            const privateKeyOctetString = encodeDerElement(0x04, pkcs1Der);

            return encodeDerElement(
                0x30,
                concatUint8Arrays(version, rsaEncryptionAlgorithm, privateKeyOctetString)
            ).buffer;
        }

        async function importRecipientPrivateKey(privateKeyPem) {
            const privateKeyDer = new Uint8Array(privateKeyPemToArrayBuffer(privateKeyPem));
            const privateKeyBuffer = privateKeyPem.includes('BEGIN RSA PRIVATE KEY')
                ? pkcs1PrivateKeyToPkcs8(privateKeyDer)
                : privateKeyDer.buffer;

            return crypto.subtle.importKey(
                'pkcs8',
                privateKeyBuffer,
                { name: 'RSA-OAEP', hash: 'SHA-256' },
                false,
                ['decrypt']
            );
        }


        async function decryptMessageForRecipient(encryptedPayload, recipientPrivateKey) {
            let encryptedKeyBase64 = '';
            
            // Handle both legacy (single string) and new (JSON) formats
            try {
                const keys = JSON.parse(encryptedPayload.encrypted_key);
                const currentUserId = localStorage.getItem('vc_user_id');
                encryptedKeyBase64 = keys[currentUserId];
            } catch (e) {
                // If not JSON, assume it's the legacy single string format
                encryptedKeyBase64 = encryptedPayload.encrypted_key;
            }

            if (!encryptedKeyBase64) {
                throw new Error("No hay una llave cifrada disponible para este usuario.");
            }

            const rawAesKey = await crypto.subtle.decrypt(
                { name: 'RSA-OAEP' },
                recipientPrivateKey,
                base64ToArrayBuffer(encryptedKeyBase64)
            );
            const aesKey = await crypto.subtle.importKey(
                'raw',
                rawAesKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
            const ciphertext = new Uint8Array(base64ToArrayBuffer(encryptedPayload.ciphertext));
            const authTag = new Uint8Array(base64ToArrayBuffer(encryptedPayload.auth_tag));
            const nonce = new Uint8Array(base64ToArrayBuffer(encryptedPayload.nonce));
            const ciphertextWithTag = concatUint8Arrays(ciphertext, authTag);
            const plaintextBuffer = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: nonce, tagLength: 128 },
                aesKey,
                ciphertextWithTag
            );

            return new TextDecoder().decode(plaintextBuffer);
        }

        function setMessageContent(messageElement, lockText, bodyText, metaText) {
            messageElement.textContent = '';

            const lockIcon = document.createElement('span');
            lockIcon.className = 'lock-icon';
            lockIcon.textContent = lockText;

            const body = document.createTextNode(` ${bodyText}`);
            const meta = document.createElement('span');
            meta.className = 'message-meta';
            meta.textContent = metaText;

            messageElement.append(lockIcon, body, meta);
        }

        function renderStoredMessage(message) {
            const currentUserId = localStorage.getItem('vc_user_id');
            const isReceived = message.recipient_id === currentUserId;
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isReceived ? 'received' : 'sent'} encrypted`;

            messageElement.dataset.encryptedPayload = JSON.stringify({
                ciphertext: message.ciphertext,
                encrypted_key: message.encrypted_key,
                nonce: message.nonce,
                auth_tag: message.auth_tag
            });

            const lockChar = '🔒';
            const label = isReceived ? 'Mensaje cifrado' : 'Mensaje enviado cifrado';
            setMessageContent(messageElement, lockChar, label, isReceived ? 'Pendiente' : 'Entregado');

            return messageElement;
        }

        async function loadContacts() {
            const response = await apiFetch('/users');
            if (!response.ok) return;

            const data = await response.json();
            const list = document.getElementById('directContactsList');
            const currentUserId = localStorage.getItem('vc_user_id');
            
            list.innerHTML = '';
            data.users.forEach(user => {
                if (user.id === currentUserId) return; // No chatear con uno mismo

                const div = document.createElement('div');
                div.className = 'contact';
                div.dataset.recipientId = user.id;
                div.dataset.displayName = user.display_name;
                
                const initials = user.display_name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                
                div.innerHTML = `
                    <div class="contact-avatar">${initials}</div>
                    <div class="contact-info">
                        <div style="font-weight: 600;">${user.display_name}</div>
                        <div style="font-size: 0.8rem; opacity: 0.7; margin-top: 0.2rem;">Disponible</div>
                    </div>
                `;
                
                div.addEventListener('click', () => {
                    document.querySelectorAll('.contact').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    currentChat = { type: 'direct', id: user.id };
                    
                    // Actualizar el header del chat
                    document.getElementById('chatAvatar').textContent = initials;
                    document.getElementById('chatAvatar').style.borderRadius = '50%';
                    document.getElementById('chatName').textContent = user.display_name;
                    document.getElementById('chatStatus').textContent = 'Conexión Segura E2EE';
                    document.getElementById('memberPills').innerHTML = '';
                    
                    // Limpiar y cargar mensajes
                    lastMessageCount = 0;
                    document.getElementById('messagesContainer').textContent = '';
                    loadStoredMessages();
                });
                
                list.appendChild(div);
            });

            // Seleccionar el primero por defecto si existe
            const firstContact = document.getElementById('directContactsList').querySelector('.contact');
            if (firstContact) firstContact.click();
        }

        async function loadGroups() {
            const currentUserId = localStorage.getItem('vc_user_id');
            if (!currentUserId) return;

            const response = await apiFetch(`/groups?user_id=${currentUserId}`);
            if (!response.ok) return;

            const data = await response.json();
            const list = document.getElementById('groupsList');
            list.innerHTML = '';

            data.groups.forEach(group => {
                const div = document.createElement('div');
                div.className = 'contact';
                div.dataset.groupId = group.id;
                div.dataset.groupMembers = JSON.stringify(group.members);

                div.innerHTML = `
                    <div class="group-avatar">🔐</div>
                    <div class="contact-info" style="flex:1">
                        <div style="font-weight: 600;">${group.name}</div>
                        <div style="font-size: 0.8rem; opacity: 0.7; margin-top: 0.2rem;">${group.members.length} miembros</div>
                    </div>
                    <span class="contact-badge">Grupo</span>
                `;

                div.addEventListener('click', () => {
                    document.querySelectorAll('.contact').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    currentChat = { type: 'group', id: group.id, members: group.members };

                    document.getElementById('chatAvatar').textContent = '🔐';
                    document.getElementById('chatAvatar').style.borderRadius = '12px';
                    document.getElementById('chatName').textContent = group.name;
                    document.getElementById('chatStatus').textContent = `Grupo cifrado E2EE • ${group.members.length} miembros`;

                    const pills = document.getElementById('memberPills');
                    pills.innerHTML = group.members.map(m => `<span class="member-pill">${m.display_name}</span>`).join('');

                    lastMessageCount = 0;
                    loadStoredMessages();
                });

                list.appendChild(div);
            });
        }

        // Modal: Open
        document.getElementById('newGroupBtn').addEventListener('click', async () => {
            const response = await apiFetch('/users');
            const data = await response.json();
            const currentUserId = localStorage.getItem('vc_user_id');
            const checkboxes = document.getElementById('userCheckboxes');
            checkboxes.innerHTML = '';

            data.users.forEach(user => {
                if (user.id === currentUserId) return;
                const item = document.createElement('div');
                item.className = 'user-check-item';
                item.innerHTML = `
                    <input type="checkbox" id="user_${user.id}" value="${user.id}">
                    <label for="user_${user.id}">${user.display_name} <span style="color:#475569;font-size:0.78rem;">(${user.email})</span></label>
                `;
                checkboxes.appendChild(item);
            });

            document.getElementById('groupModal').classList.add('active');
            document.getElementById('groupNameInput').value = '';
        });

        // Modal: Cancel
        document.getElementById('cancelGroupBtn').addEventListener('click', () => {
            document.getElementById('groupModal').classList.remove('active');
        });

        // Modal: Create Group
        document.getElementById('createGroupBtn').addEventListener('click', async () => {
            const name = document.getElementById('groupNameInput').value.trim();
            const checked = [...document.querySelectorAll('#userCheckboxes input:checked')].map(cb => cb.value);
            const creatorId = localStorage.getItem('vc_user_id');

            if (!name) { alert('Escribe un nombre para el grupo.'); return; }
            if (checked.length === 0) { alert('Selecciona al menos un miembro.'); return; }

            const btn = document.getElementById('createGroupBtn');
            btn.disabled = true;
            btn.textContent = 'Creando...';

            try {
                const response = await apiFetch('/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, creator_id: creatorId, member_ids: checked })
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('groupModal').classList.remove('active');
                    await loadGroups();
                    // Auto-select the new group
                    const newGroup = document.querySelector(`[data-group-id="${data.group.id}"]`);
                    if (newGroup) newGroup.click();
                } else {
                    alert(data.error || 'Error al crear el grupo.');
                }
            } catch (err) {
                alert('Error de conexión al crear el grupo.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Crear Grupo';
            }
        });

        // Current chat state: { type: 'direct'|'group', id, members? }
        let currentChat = null;

        let lastMessageCount = 0;
        async function loadStoredMessages() {
            const currentUserId = localStorage.getItem('vc_user_id');
            if (!currentUserId || !currentChat) return;

            const isGroup = currentChat.type === 'group';
            const url = isGroup
                ? `/group_messages/${currentChat.id}`
                : `/messages/${currentUserId}?other_user_id=${currentChat.id}`;

            const response = await apiFetch(url);
            if (!response.ok) return;

            const data = await response.json();
            const messages = data.messages;
            
            // Si no hay mensajes nuevos, no parpadear la UI
            if (messages.length === lastMessageCount) return;
            lastMessageCount = messages.length;

            const container = document.getElementById('messagesContainer');
            container.textContent = '';

            // Get private key if available
            let privateKey = null;
            const privateKeyPem = sessionStorage.getItem('vc_private_key');
            if (privateKeyPem) {
                try {
                    privateKey = await importRecipientPrivateKey(privateKeyPem);
                } catch (e) {
                    console.error("Error importing private key:", e);
                }
            }

            for (const message of messages) {
                const messageElement = renderStoredMessage(message);
                container.appendChild(messageElement);

                // Auto-decrypt if we have the key
                if (privateKey && messageElement.classList.contains('encrypted')) {
                    try {
                        const encryptedPayload = JSON.parse(messageElement.dataset.encryptedPayload);
                        const plaintext = await decryptMessageForRecipient(encryptedPayload, privateKey);
                        setMessageContent(messageElement, '🔓', plaintext, 'Descifrado');
                        messageElement.classList.remove('encrypted');
                    } catch (e) {
                        console.error("Auto-decryption failed for a message:", e);
                    }
                }
            }
            container.scrollTop = container.scrollHeight;
        }


        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;

            // Grab real user_id saved during login
            const senderId = localStorage.getItem('vc_user_id');
            if (!senderId) {
                window.location.href = '/login.html';
                return;
            }

            if (!currentChat) {
                alert('Selecciona un contacto o grupo primero.');
                return;
            }

            // UI Update (Optimistic)
            const container = document.getElementById('messagesContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            setMessageContent(msgDiv, '🔒', text, 'Enviando...');
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            input.value = '';

            try {
                const senderPublicKey = localStorage.getItem('vc_public_key');
                if (!senderPublicKey) throw new Error("No se encontró tu propia llave pública. Cierra sesión e inicia de nuevo.");

                if (currentChat.type === 'group') {
                    // Group message: encrypt for all members
                    const membersResp = await apiFetch(`/groups/${currentChat.id}/members`);
                    const membersData = await membersResp.json();
                    const recipients = {};
                    membersData.members.forEach(m => { if (m.public_key) recipients[m.id] = m.public_key; });

                    const encryptedPayload = await encryptMessageForRecipients(text, recipients);
                    const response = await apiFetch('/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender_id: senderId, group_id: currentChat.id, ...encryptedPayload })
                    });
                    if (response.ok) {
                        msgDiv.querySelector('.message-meta').textContent = 'Entregado ✔';
                        lastMessageCount = 0; // force reload
                    } else {
                        const err = await response.json();
                        msgDiv.querySelector('.message-meta').textContent = 'Error: ' + (err.error || 'al enviar');
                        msgDiv.querySelector('.message-meta').style.color = '#ef4444';
                    }
                } else {
                    // Direct message
                    const recipientId = currentChat.id;
                    const recipientPublicKey = await fetchRecipientPublicKey(recipientId);
                    const recipients = { [recipientId]: recipientPublicKey, [senderId]: senderPublicKey };
                    const encryptedPayload = await encryptMessageForRecipients(text, recipients);

                    const response = await apiFetch('/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender_id: senderId, recipient_id: recipientId, ...encryptedPayload })
                    });
                    if (response.ok) {
                        msgDiv.querySelector('.message-meta').textContent = 'Entregado ✔';
                        lastMessageCount = 0;
                    } else {
                        msgDiv.querySelector('.message-meta').textContent = 'Error al enviar';
                        msgDiv.querySelector('.message-meta').style.color = '#ef4444';
                    }
                }
            } catch (err) {
                console.error("Error detallado al enviar:", err);
                msgDiv.querySelector('.message-meta').textContent = 'Error: ' + err.message;
                msgDiv.querySelector('.message-meta').style.color = '#ef4444';
            }
        });

        loadContacts();
        loadGroups();

        // Autoload de mensajes cada 1 segundo
        setInterval(() => {
            loadStoredMessages();
            loadGroups();
        }, 1000);
    </script>
</body>
</html>
