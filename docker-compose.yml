services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultchain_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vaultchain_secure_messaging_development}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultchain} -d ${POSTGRES_DB:-vaultchain_secure_messaging_development}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-vaultchain}:${POSTGRES_PASSWORD:-vaultchain_dev_password}@db:5432/${POSTGRES_DB:-vaultchain_secure_messaging_development}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log

volumes:
  db_data:
  bundle_cache:
  rails_tmp:
  rails_log:
